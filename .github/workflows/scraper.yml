name: Tark Scraper Daemon

on:
  schedule:
    - cron: '30 2,10,16 * * *' # Morning (8am IST), Evening (4pm IST), Night (10pm IST)
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max GH Actions timeout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No browser needed — the unified ingest uses got-scraping (HTTP), not a
      # headless browser. (Playwright install removed.)

      - name: Run Scraper Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LLM keys — REQUIRED. Without at least one, synthesis is impossible and
          # every non-pre-summarized item is dropped (the old silent-failure bug).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx tsx scripts/run-scraper.ts
